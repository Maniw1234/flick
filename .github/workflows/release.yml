# Builds and publishes a Flick release whenever a push to main carries a version number that has no release yet.
#
#   1. bump "version" in pc/package.json (and add a "## <version>" section to CHANGES.md)
#   2. push to main
#   3. once it is published, sign it on the computer that keeps the release key: node signing/sign_release.js <version>
#      (installed copies take a release only once it has a valid SHA256SUMS.sig; this workflow never sees that key)
#
# Installed copies of Flick check the latest release and update themselves: the PC (pc/updater.js) and the phone, which
# also gets the phone app inside the PC's copy over Wi-Fi. The phone app is rebuilt and signed here only when it changed
# since the last release (ci/phone_app.sh), with the key in the FLICK_SIGNING_KEY secret (see signing/README.md).
#
# Actions > Release > Run workflow with "Only build and check" ticked builds everything, including a signed phone app,
# and publishes nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check:
        description: Only build and check (always signs the phone app; publishes nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # third-party code that runs with the signing secret in reach is pinned to an exact commit, not a movable tag
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # history and tags: to tell whether the phone app changed since the last release

      - name: New version?
        id: v
        env:
          CHECK: ${{ inputs.check }}
        run: |
          V=$(node -p "require('./pc/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$CHECK" = true ]; then
            { echo "check=true"; echo "new=true"; } >> "$GITHUB_OUTPUT"; echo "check run: building v$V, publishing nothing"
          elif gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" --silent 2> /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$V is already released: nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "building v$V"
          fi

      - name: Tools
        if: steps.v.outputs.new == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nsis wine64 xvfb zip unzip gcc-mingw-w64-x86-64 > /dev/null
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          # every downloaded tool is checked against a known checksum before it touches the build
          EV=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronVersion")
          ESHA=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronSha256 || ''")
          [ -n "$ESHA" ] || { echo "::error::pc/package.json has no electronSha256 for Electron $EV"; exit 1; }
          curl -fsSL -o electron-win32-x64.zip "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-win32-x64.zip"
          curl -fsSL -o rcedit-x64.exe "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          curl -fsSL -o uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          sha256sum -c - <<SUMS
          $ESHA  electron-win32-x64.zip
          3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a  rcedit-x64.exe
          e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer.jar
          SUMS

      - name: Phone app (rebuilt and signed only if it changed since the last release)
        if: steps.v.outputs.new == 'true'
        env:
          FLICK_SIGNING_KEY: ${{ secrets.FLICK_SIGNING_KEY }}
          SIGNER: ${{ runner.temp }}/tools/uber-apk-signer.jar
          FORCE_PHONE_BUILD: ${{ steps.v.outputs.check == 'true' && '1' || '0' }}
          VERSION: ${{ steps.v.outputs.version }}
        run: ci/phone_app.sh "$VERSION"

      - name: Build the Windows app, its update bundle and the installer
        if: steps.v.outputs.new == 'true'
        run: |
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          EZIP="$RUNNER_TEMP/tools/electron-win32-x64.zip" RCEDIT="$RUNNER_TEMP/tools/rcedit-x64.exe" WINE="$WINE" \
          WINEPREFIX="$RUNNER_TEMP/wine" NSISDIR=/usr/share/nsis MAKENSIS=makensis MINGW_CC=x86_64-w64-mingw32-gcc STRICT=1 ./build_win.sh

      - name: Publish the release
        if: steps.v.outputs.new == 'true' && steps.v.outputs.check != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          OUT=build/release && mkdir -p "$OUT"
          APKV=$(node -p "require('./pc/apkinfo').apkInfo('pc/phone-app/Flick.apk').name")
          cp build/win/Flick-Setup.exe "$OUT/Flick-Setup.exe"
          cp build/win/flick-app-$V.zip "$OUT/flick-app-$V.zip"
          cp pc/phone-app/Flick.apk "$OUT/Flick-$APKV.apk"
          ( cd "$OUT" && sha256sum * > SHA256SUMS )
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGES.md > notes.md
          [ -s notes.md ] || echo "Flick $V" > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "Flick $V" --notes-file notes.md --latest "$OUT"/*
