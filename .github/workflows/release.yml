# Builds and publishes a Flick release whenever a push to main carries a version number that has no release yet.
#
#   1. bump "version" in pc/package.json (and add a "## <version>" section to CHANGES.md)
#   2. push to main
#   3. once it is published, sign it on the computer that keeps the release key, in the checkout you pushed from:
#      node signing/sign_release.js <version> (it signs only a release that is exactly what that commit builds;
#      installed copies take a release only once it has a valid SHA256SUMS.sig; this workflow never sees that key)
#
# Installed copies of Flick check the latest release and update themselves: the PC (pc/updater.js) and the phone, which
# also gets the phone app inside the PC's copy over Wi-Fi. The phone app is rebuilt and signed here only when it changed
# since the last release (ci/phone_app.sh), with the key in the FLICK_SIGNING_KEY secret (see signing/README.md).
#
# Jobs: "release" decides, puts the phone app together and builds the Windows app; "mac" (on a Mac) and "linux" build
# theirs with that phone app inside; "publish" puts everything in one release with one SHA256SUMS; "play" uploads the
# Google Play version of the phone app (when the phone app changed) to Google Play.
#
# Google Play: the PLAY_SERVICE_ACCOUNT secret is the key (JSON) of a Google Cloud service account the Play Console
# lets release Flick; without it "play" skips. The variables PLAY_TRACK (internal, alpha, beta or production, the
# default) and PLAY_STATUS (draft, the default: it waits for "Start rollout" in the Play Console; or completed) say
# where it goes. The very first Play release is uploaded by hand (Google's API can't): see ci/play_upload.js and
# play/listing.md ("The first release"). A version Google Play has already is a notice, not a failure.
#
# Actions > Release > Run workflow with "Only build and check" ticked builds everything, including a signed phone app,
# and publishes nothing (the builds stay downloadable from the run for a few days).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check:
        description: Only build and check (always signs the phone app; publishes nothing)
        type: boolean
        default: false

# read-only by default: only "publish" writes (it makes the release), so the job that holds the signing secret and runs
# the build tools has no token that could change the repository
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
      check: ${{ steps.v.outputs.check }}
      bundle: ${{ steps.phone.outputs.bundle }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # third-party code that runs with the signing secret in reach is pinned to an exact commit, not a movable tag
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # history and tags: to tell whether the phone app changed since the last release
          persist-credentials: false  # nothing here pushes: no token left in .git/config for the build steps

      - name: New version?
        id: v
        env:
          CHECK: ${{ inputs.check }}
        run: |
          V=$(node -p "require('./pc/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$CHECK" = true ]; then
            { echo "check=true"; echo "new=true"; } >> "$GITHUB_OUTPUT"; echo "check run: building v$V, publishing nothing"
          elif gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" --silent 2> /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$V is already released: nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "building v$V"
          fi

      - name: Tools
        if: steps.v.outputs.new == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nsis wine64 xvfb zip unzip gcc-mingw-w64-x86-64 > /dev/null
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          # every downloaded tool is checked against a known checksum before it touches the build
          EV=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronVersion")
          ESHA=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronSha256 || ''")
          [ -n "$ESHA" ] || { echo "::error::pc/package.json has no electronSha256 for Electron $EV"; exit 1; }
          curl -fsSL -o electron-win32-x64.zip "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-win32-x64.zip"
          curl -fsSL -o rcedit-x64.exe "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          curl -fsSL -o uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          curl -fsSL -o bundletool-all-1.18.3.jar "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          sha256sum -c - <<SUMS
          $ESHA  electron-win32-x64.zip
          3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a  rcedit-x64.exe
          e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer.jar
          a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool-all-1.18.3.jar
          SUMS

      - name: Phone app (rebuilt and signed only if it changed since the last release)
        id: phone
        if: steps.v.outputs.new == 'true'
        env:
          FLICK_SIGNING_KEY: ${{ secrets.FLICK_SIGNING_KEY }}
          SIGNER: ${{ runner.temp }}/tools/uber-apk-signer.jar
          BUNDLETOOL: ${{ runner.temp }}/tools/bundletool-all-1.18.3.jar
          FORCE_PHONE_BUILD: ${{ steps.v.outputs.check == 'true' && '1' || '0' }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ci/phone_app.sh "$VERSION"
          # (the "play" job is told whether there is a bundle, so a bundle it can't fetch is an error, not "no change")
          if [ -s build/Flick-play.aab ]; then echo "bundle=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the Windows app, its update bundle and the installer
        if: steps.v.outputs.new == 'true'
        run: |
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          EZIP="$RUNNER_TEMP/tools/electron-win32-x64.zip" RCEDIT="$RUNNER_TEMP/tools/rcedit-x64.exe" WINE="$WINE" \
          WINEPREFIX="$RUNNER_TEMP/wine" NSISDIR=/usr/share/nsis MAKENSIS=makensis MINGW_CC=x86_64-w64-mingw32-gcc STRICT=1 ./build_win.sh

      # the Mac and Linux apps carry the same phone app; the publish job takes everything from these
      - name: Hand the phone app to the Mac and Linux builds
        if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (Node 24)
        with:
          name: phone-app
          path: pc/phone-app/Flick.apk
          if-no-files-found: error
          retention-days: 5

      # the Google Play version's bundle, when the phone app was built (a reused one has nothing new for Play)
      - name: Keep the Google Play bundle
        if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (Node 24)
        with:
          name: play-bundle
          path: build/Flick-play.aab
          if-no-files-found: ignore
          retention-days: 5

      - name: Keep the Windows app for the release
        if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (Node 24)
        with:
          name: windows
          path: |
            build/win/Flick-Setup.exe
            build/win/flick-app-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 5

  mac:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0 (Node 24)
        with:
          name: phone-app
          path: pc/phone-app

      - name: Tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          # every downloaded tool is checked against a known checksum before it touches the build
          EV=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronVersion")
          A=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronSha256MacArm64 || ''")
          X=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronSha256MacX64 || ''")
          [ -n "$A" ] && [ -n "$X" ] || { echo "::error::pc/package.json has no electronSha256MacArm64/electronSha256MacX64 for Electron $EV"; exit 1; }
          curl -fsSL -o electron-darwin-arm64.zip "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-darwin-arm64.zip"
          curl -fsSL -o electron-darwin-x64.zip "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-darwin-x64.zip"
          shasum -a 256 -c - <<SUMS
          $A  electron-darwin-arm64.zip
          $X  electron-darwin-x64.zip
          SUMS

      - name: Build the Mac apps (Apple Silicon and Intel), their disk images and the update bundle
        run: |
          EZIP_ARM64="$RUNNER_TEMP/tools/electron-darwin-arm64.zip" EZIP_X64="$RUNNER_TEMP/tools/electron-darwin-x64.zip" STRICT=1 ./build_mac.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (Node 24)
        with:
          name: mac
          path: |
            build/mac/Flick-mac-arm64.dmg
            build/mac/Flick-mac-x64.dmg
            build/mac/flick-app-mac-${{ needs.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 5

  linux:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0 (Node 24)
        with:
          name: phone-app
          path: pc/phone-app

      - name: Tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          # every downloaded tool is checked against a known checksum before it touches the build
          EV=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronVersion")
          L=$(node -p "require('$GITHUB_WORKSPACE/pc/package.json').electronSha256LinuxX64 || ''")
          [ -n "$L" ] || { echo "::error::pc/package.json has no electronSha256LinuxX64 for Electron $EV"; exit 1; }
          curl -fsSL -o electron-linux-x64.zip "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-linux-x64.zip"
          # appimagetool, and the AppImage runtime it puts in front of the image (a fixed one, not the latest)
          curl -fsSL -o appimagetool-x86_64.AppImage "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          curl -fsSL -o runtime-x86_64 "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          sha256sum -c - <<SUMS
          $L  electron-linux-x64.zip
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          SUMS

      - name: Build the Linux app (AppImage and tar.gz) and its update bundle
        run: |
          T="$RUNNER_TEMP/tools"
          EZIP="$T/electron-linux-x64.zip" APPIMAGETOOL="$T/appimagetool-x86_64.AppImage" RUNTIME="$T/runtime-x86_64" ./build_linux.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (Node 24)
        with:
          name: linux
          path: |
            build/linux/Flick-linux-x86_64.AppImage
            build/linux/Flick-linux-x64.tar.gz
            build/linux/flick-app-linux-${{ needs.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: [release, mac, linux]
    # (only from main: a run started by hand on another branch builds and checks, and publishes nothing)
    if: needs.release.outputs.new == 'true' && needs.release.outputs.check != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # makes the release (and finds the owner's drafts, which only write access sees)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0 (Node 24)
        with:
          path: build/artifacts       # each in a folder named after it: phone-app, windows, mac, linux

      - name: Publish the release
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          OUT=build/release && mkdir -p "$OUT"
          A=build/artifacts
          APKV=$(node -p "require('./pc/apkinfo').apkInfo('$A/phone-app/Flick.apk').name")
          # Windows keeps its names: installed copies update from flick-app-<version>.zip
          cp "$A/windows/Flick-Setup.exe" "$A/windows/flick-app-$V.zip" "$OUT/"
          cp "$A/mac/Flick-mac-arm64.dmg" "$A/mac/Flick-mac-x64.dmg" "$A/mac/flick-app-mac-$V.zip" "$OUT/"
          cp "$A/linux/Flick-linux-x86_64.AppImage" "$A/linux/Flick-linux-x64.tar.gz" "$A/linux/flick-app-linux-$V.zip" "$OUT/"
          cp "$A/phone-app/Flick.apk" "$OUT/Flick-$APKV.apk"
          # exactly these files: signing/sign_release.js refuses a release with any other (keep the two in step)
          ( cd "$OUT" && sha256sum -- * > SHA256SUMS )
          # and the phone app once more under a name that stays the same, for a link that always gives the latest
          # (releases/latest/download/Flick.apk). Not in SHA256SUMS, which every installed Flick reads as it is:
          # sign_release.js lets this one file by, when it is the phone app above byte for byte.
          cp "$OUT/Flick-$APKV.apk" "$OUT/Flick.apk"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGES.md > notes.md
          [ -s notes.md ] || echo "Flick $V" > notes.md
          # A draft of this release made by the repository's owner beforehand (its tag v<version> or V<version>, or no tag
          # yet and the version in its title) gets the files and goes out as v<version>, so the release shows as the
          # owner's; without one, this workflow makes the release.
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq "[.[] | select(.draft and (((.tag_name // \"\") | ascii_downcase) == \"v$V\" or ((.tag_name // \"\") == \"\" and ((.name // \"\") | contains(\"$V\")))))][0].id // empty")
          if [ -n "$DRAFT" ]; then
            for f in "$OUT"/*; do
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$DRAFT/assets?name=$(basename "$f")" > /dev/null
            done
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT" -f tag_name="v$V" -f target_commitish="$GITHUB_SHA" \
              -f name="Flick $V" -F body=@notes.md -F draft=false -f make_latest=true --silent
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Flick $V" --notes-file notes.md --latest "$OUT"/*
          fi

  play:
    needs: [release, publish]
    # (only from main: a run started by hand on another branch builds and checks, and publishes nothing)
    if: needs.release.outputs.new == 'true' && needs.release.outputs.check != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0 (Node 24)
        if: needs.release.outputs.bundle == 'true'      # (no bundle: the phone app didn't change)
        with:
          name: play-bundle
          path: build/play

      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_STATUS: ${{ vars.PLAY_STATUS }}
          V: ${{ needs.release.outputs.version }}
          BUNDLE: ${{ needs.release.outputs.bundle }}
        run: |
          if [ "$BUNDLE" != true ]; then echo "::notice title=Google Play::The phone app didn't change: nothing new for Google Play"; exit 0; fi
          if [ ! -s build/play/Flick-play.aab ]; then echo "::error title=Google Play::The Google Play bundle this run built isn't here"; exit 1; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then echo "::notice title=Google Play::No PLAY_SERVICE_ACCOUNT secret: not uploaded (the bundle is kept with this run)"; exit 0; fi
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGES.md > notes.md
          node ci/play_upload.js build/play/Flick-play.aab "$V" notes.md
